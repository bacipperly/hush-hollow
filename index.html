<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hush Hollow</title>
<style>
  :root { --ink:#3b2a1e; --paper:#fffaf0; --green:#6cc04a; --yellow:#ffcf3d; --red:#ff5a4e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#bfe6ff; font-family: "Baloo 2", "Chalkboard SE", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif; color:var(--ink); user-select:none; -webkit-user-select:none; }
  canvas#game { position:fixed; inset:0; width:100%; height:100%; display:block; }

  .card { background:var(--paper); border-radius:18px; box-shadow: 0 4px 0 rgba(59,42,30,.18), 0 0 0 4px #fff inset; border:3px solid #e9dcc3; }

  /* Sound meter */
  #meter { position:fixed; top:14px; left:50%; transform:translateX(-50%); width:min(560px, 92vw); padding:10px 16px 8px; display:none; }
  #meterRow { display:flex; align-items:center; gap:10px; }
  .face { font-size:30px; line-height:1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
  #bar { position:relative; flex:1; height:30px; border-radius:16px; overflow:hidden; background:#efe6d4; border:3px solid #e2d3b6; }
  #zones { position:absolute; inset:0; display:flex; opacity:.35; }
  #zones div { height:100%; }
  #fill { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:12px; transition: background .2s; }
  #peak { position:absolute; top:-2px; bottom:-2px; width:4px; border-radius:2px; background:var(--ink); opacity:.55; left:0; }
  .tick { position:absolute; top:0; bottom:0; width:3px; background:#fff; opacity:.9; }
  #status { text-align:center; font-size:20px; font-weight:800; margin-top:4px; letter-spacing:.3px; min-height:26px; }

  /* Top-right controls */
  #hud { position:fixed; top:14px; right:14px; display:none; flex-direction:column; align-items:flex-end; gap:8px; }
  #count { padding:6px 14px; font-size:20px; font-weight:800; }
  button.big { font: inherit; font-size:18px; font-weight:800; color:#fff; border:none; border-radius:16px; padding:10px 16px; cursor:pointer;
    background:#ff8a3d; box-shadow: 0 5px 0 #c8601f; transition: transform .08s, box-shadow .08s; }
  button.big:active { transform: translateY(4px); box-shadow: 0 1px 0 #c8601f; }
  button.big.on { background:#8b5cf6; box-shadow:0 5px 0 #5b33b8; }
  #nightBtn { background:#3b4a8c; box-shadow:0 5px 0 #222c5e; }
  #nightBtn:active { box-shadow:0 1px 0 #222c5e; }
  #nightBtn.day { background:#f5b82e; box-shadow:0 5px 0 #c48a12; color:#5a3a08; }
  #nightBtn.day:active { box-shadow:0 1px 0 #c48a12; }
  button.small { font: inherit; font-size:15px; font-weight:700; border:none; background:#fff; color:var(--ink); border-radius:12px; padding:6px 12px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  #settings { padding:10px 14px; display:none; font-size:15px; font-weight:700; width:230px; }
  #settings label { display:block; margin-bottom:4px; }
  #settings input[type=range] { width:100%; }
  #settings .hint { font-weight:500; font-size:13px; opacity:.75; margin-top:4px; }

  /* Roster */
  #roster { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); width:max-content; display:none; gap:4px; padding:6px 10px; max-width:96vw; flex-wrap:wrap; justify-content:center; }
  #roster canvas { width:44px; height:44px; border-radius:10px; background:#f3ead8; }
  #roster canvas.seen { background:#fff2c6; }

  /* No-mic noise button */
  #noiseBtn { position:fixed; left:16px; bottom:90px; width:104px; height:104px; border-radius:50%; font-size:15px; display:none; line-height:1.1;
    touch-action:none; user-select:none; -webkit-user-select:none; --hold:0; --ring:var(--green); }
  /* the ring fills up the longer you hold: green = whisper, yellow = talking, red = loud */
  #noiseBtn::before { content:""; position:absolute; inset:-9px; border-radius:50%; pointer-events:none;
    background:conic-gradient(var(--ring) calc(var(--hold) * 360deg), rgba(255,255,255,.55) 0);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px)); }
  #noiseBtn .nb-icon { font-size:26px; display:block; }

  /* Too loud: UI gets rattled. --wig (0..1) is set from the script and scales every motion,
     so the wiggle grows with the noise and fades out smoothly as it gets quieter. */
  body { --wig: 0; }
  @keyframes hh-rock {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    20% { transform: translateX(calc(-50% - 5px * var(--wig))) rotate(calc(-2deg * var(--wig))); }
    50% { transform: translateX(calc(-50% + 4px * var(--wig))) translateY(calc(2px * var(--wig))) rotate(calc(1.6deg * var(--wig))); }
    75% { transform: translateX(calc(-50% - 2px * var(--wig))) translateY(calc(-1px * var(--wig))) rotate(calc(-0.8deg * var(--wig))); }
  }
  @keyframes hh-wobble {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: translateY(calc(-2px * var(--wig))) rotate(calc(-4deg * var(--wig))); }
    75% { transform: translateY(calc(1px * var(--wig))) rotate(calc(4deg * var(--wig))); }
  }
  @keyframes hh-hop {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30% { transform: translateY(calc(-7px * var(--wig))) rotate(calc(-7deg * var(--wig))); }
    60% { transform: translateY(calc(1px * var(--wig))) rotate(calc(5deg * var(--wig))); }
  }
  @keyframes hh-pulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(calc(1 + 0.3 * var(--wig))) rotate(calc(-10deg * var(--wig))); }
  }
  @keyframes hh-jitter {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(calc(-2px * var(--wig)), calc(1px * var(--wig))); }
    50% { transform: translate(calc(2px * var(--wig)), calc(-1px * var(--wig))); }
    75% { transform: translate(calc(-1px * var(--wig)), calc(-1px * var(--wig))); }
  }
  body.loud #meter { animation: hh-rock .34s ease-in-out infinite; }
  body.loud #meter .face { animation: hh-pulse .26s ease-in-out infinite; }
  body.loud #meter .face:first-child { animation: hh-jitter .12s linear infinite; }
  body.loud #status { animation: hh-jitter .16s linear infinite; }
  body.loud #bar { box-shadow: 0 0 calc(16px * var(--wig)) rgba(255,70,50,.85); }
  body.loud #hud > * { animation: hh-wobble .3s ease-in-out infinite; }
  body.loud #hud > :nth-child(2) { animation-duration: .27s; animation-delay: -.09s; }
  body.loud #hud > :nth-child(3) { animation-duration: .33s; animation-delay: -.17s; }
  body.loud #hud > :nth-child(4) { animation-duration: .25s; animation-delay: -.05s; }
  body.loud #roster canvas { animation: hh-hop .3s ease-in-out infinite; }
  body.loud #roster canvas:nth-child(2n) { animation-duration: .26s; animation-delay: -.1s; }
  body.loud #roster canvas:nth-child(3n) { animation-duration: .34s; animation-delay: -.2s; }
  body.loud #roster canvas:nth-child(5n) { animation-delay: -.06s; }
  body.loud #noiseBtn { animation: hh-pulse .3s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { body.loud * { animation: none !important; } }

  /* Start screen */
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background: rgba(40,70,40,.35); backdrop-filter: blur(2px); }
  #startCard { padding:28px 32px; text-align:center; max-width:min(520px, 92vw); }
  #startCard h1 { margin:0 0 6px; font-size:46px; letter-spacing:1px; color:#4d8a2a; text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(0,0,0,.1); }
  #startCard p { font-size:19px; margin:8px 0; line-height:1.35; }
  #startCard .rules { text-align:left; display:inline-block; font-size:18px; margin:6px 0 16px; }
  #startCard .rules div { margin:4px 0; }
  #startBtn { font-size:24px; padding:14px 28px; background:#4fb33c; box-shadow:0 6px 0 #2f7d22; }
  #startBtn:active { box-shadow:0 1px 0 #2f7d22; }
  #noMicLink { display:block; margin:16px auto 0; background:none; border:none; font:inherit; font-size:16px; color:#6b5440; text-decoration:underline; cursor:pointer; }
  #micErr { color:#c0392b; font-weight:700; display:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="meter" class="card">
  <div id="meterRow">
    <div class="face">🤫</div>
    <div id="bar">
      <div id="zones"></div>
      <div id="fill"></div>
      <div class="tick" id="tickA"></div>
      <div class="tick" id="tickB"></div>
      <div id="peak"></div>
    </div>
    <div class="face">📣</div>
  </div>
  <div id="status">Shhh…</div>
</div>

<div id="hud">
  <div id="count" class="card">🐾 0 / 0</div>
  <button id="nightBtn" class="big">🌙 Make it Night</button>
  <button id="allBtn" class="big">✨ Show All Animals</button>
  <button id="gearBtn" class="small">⚙️ Mic settings</button>
  <div id="settings" class="card">
    <label for="sens">Microphone sensitivity</label>
    <input id="sens" type="range" min="0" max="1" step="0.01" value="0.5">
    <div class="hint">If the bar jumps up in a quiet room, slide left. If shouting barely moves it, slide right.</div>
  </div>
</div>

<div id="roster" class="card"></div>
<button id="noiseBtn" class="big"><span class="nb-icon">🔊</span><span class="nb-text">Hold to<br>make noise</span></button>

<div id="start">
  <div id="startCard" class="card">
    <h1>Hush Hollow</h1>
    <p>The animals of the forest are shy.</p>
    <div class="rules">
      <div>🤫 Be quiet, and they'll come out to play.</div>
      <div>🗣️ Talk, and they'll stop and get sad.</div>
      <div>📣 Get too loud, and they'll run away!</div>
    </div>
    <div><button id="startBtn" class="big">🎤 Let's Play!</button></div>
    <p id="micErr"></p>
    <button id="noMicLink">Play without a microphone</button>
  </div>
</div>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------- tuning
const QUIET = 0.30;          // below this = quiet (animals come)
const LOUD  = 0.62;          // above this = too loud (animals get scared)
const SPAWN_EVERY = 2.0;     // seconds between new arrivals while quiet
const QUIET_BEFORE_SPAWN = 1.2;

const params = new URLSearchParams(location.search);
const SIM = params.has("sim");   // ?sim=0.1 forces a level, for testing

// ---------------------------------------------------------------- canvas
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, HORIZON = 0;
let bgDay = null, bgNight = null;
let stars = [], flies = [];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = layer.width = Math.round(W * DPR); cv.height = layer.height = Math.round(H * DPR);
  HORIZON = H * 0.40;
  bgDay = buildBackground(DAY);
  bgNight = buildBackground(NIGHT);
  buildTrees();
  buildSky();
}
window.addEventListener("resize", resize);

// world -> screen. x: 0..1 across, z: 0 (far) .. 1 (near)
function proj(x, z) {
  const groundTop = HORIZON + (H - HORIZON) * 0.10;
  const groundBot = H - Math.max(70, H * 0.12);
  const y = groundTop + (groundBot - groundTop) * z;
  const spread = 0.82 + 0.30 * z;
  const sx = W / 2 + (x - 0.5) * W * spread;
  const unit = Math.min(W, H * 1.6) / 1000;
  const s = (0.55 + 0.75 * z) * unit * 1.25;
  return { x: sx, y, s };
}

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// "Pen": draws every shape three times (drop shadow, white paper edge, fill)
// so every character looks like a paper cut-out.
function makePen(c, edge = "#fff") {
  const pen = {
    mode: "fill",
    _out(color) {
      if (pen.mode === "shadow") { c.fillStyle = c.strokeStyle = "rgba(40,30,20,0.22)"; c.fill(); c.stroke(); }
      else if (pen.mode === "edge") { c.fillStyle = c.strokeStyle = edge; c.fill(); c.stroke(); }
      else if (pen.mode === "sil") { c.fillStyle = "#cbbd9f"; c.fill(); }
      else { c.fillStyle = color; c.fill(); }
    },
    e(x, y, rx, ry, rot, color) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); pen._out(color); },
    c(x, y, r, color) { c.beginPath(); c.arc(x, y, Math.abs(r), 0, Math.PI * 2); pen._out(color); },
    p(pts, color) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); pen._out(color); },
    r(x, y, w, h, rad, color) { rr(c, x, y, w, h, rad); pen._out(color); },
    // detail: no outline, only drawn in fill pass
    d(fn) { if (pen.mode === "fill") fn(c); },
  };
  return pen;
}
// Trees and animals are drawn onto their own layer so night can tint them
// without dimming the moon and stars.
const layer = document.createElement("canvas");
const lctx = layer.getContext("2d");
const pen = makePen(lctx);

function drawCutout(c, p, lw, fn) {
  c.lineJoin = "round"; c.lineCap = "round";
  c.save(); c.translate(3, 4); c.lineWidth = lw; p.mode = "shadow"; fn(); c.restore();
  c.lineWidth = lw; p.mode = "edge"; fn();
  p.mode = "fill"; fn();
}

// ---------------------------------------------------------------- faces
// spec: { eyes:[[x,y],..], er, mouth:[x,y], mw, white:bool }
function drawFace(c, f, mood, t, blink) {
  const er = f.er, ink = "#2a1a12";
  c.save();
  c.lineCap = "round"; c.lineJoin = "round";
  if (f.white) for (const [x, y] of f.eyes) { c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, er * 1.45, 0, 7); c.fill(); }

  if (mood === "happy") {
    c.strokeStyle = ink; c.lineWidth = er * 0.75;
    for (const [x, y] of f.eyes) { c.beginPath(); c.arc(x, y + er * 0.5, er * 0.95, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
    c.fillStyle = "rgba(255,110,130,0.45)";
    for (const [x, y] of f.eyes) { c.beginPath(); c.ellipse(x + er * 0.3, y + er * 2.1, er * 1.2, er * 0.75, 0, 0, 7); c.fill(); }
    const [mx, my] = f.mouth;
    c.fillStyle = "#7a2b2b"; c.beginPath(); c.arc(mx, my - f.mw * 0.15, f.mw * 0.55, 0.1, Math.PI - 0.1); c.closePath(); c.fill();
    c.fillStyle = "#ff8fa3"; c.beginPath(); c.arc(mx, my + f.mw * 0.18, f.mw * 0.25, 0, Math.PI); c.fill();
  } else if (mood === "ok") {
    for (const [x, y] of f.eyes) {
      if (blink) { c.strokeStyle = ink; c.lineWidth = er * 0.6; c.beginPath(); c.moveTo(x - er, y); c.lineTo(x + er, y); c.stroke(); continue; }
      c.fillStyle = ink; c.beginPath(); c.ellipse(x, y, er * 0.85, er, 0, 0, 7); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(x + er * 0.3, y - er * 0.4, er * 0.33, 0, 7); c.fill();
    }
    const [mx, my] = f.mouth;
    c.strokeStyle = ink; c.lineWidth = Math.max(1.5, er * 0.5);
    c.beginPath(); c.arc(mx, my - f.mw * 0.3, f.mw * 0.4, 0.35, Math.PI - 0.35); c.stroke();
  } else if (mood === "sad") {
    for (const [x, y] of f.eyes) {
      c.fillStyle = ink; c.beginPath(); c.ellipse(x, y + er * 0.2, er * 0.8, er * 0.85, 0, 0, 7); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(x + er * 0.25, y - er * 0.1, er * 0.3, 0, 7); c.fill();
    }
    // worried brows
    c.strokeStyle = ink; c.lineWidth = er * 0.45;
    const [a, b] = f.eyes.length > 1 ? [f.eyes[0], f.eyes[1]] : [f.eyes[0], [f.eyes[0][0] + er * 3, f.eyes[0][1]]];
    c.beginPath(); c.moveTo(a[0] - er, a[1] - er * 1.3); c.lineTo(a[0] + er * 0.8, a[1] - er * 2.0); c.stroke();
    if (f.eyes.length > 1) { c.beginPath(); c.moveTo(b[0] + er, b[1] - er * 1.3); c.lineTo(b[0] - er * 0.8, b[1] - er * 2.0); c.stroke(); }
    const [mx, my] = f.mouth;
    c.lineWidth = Math.max(1.5, er * 0.5);
    c.beginPath(); c.arc(mx, my + f.mw * 0.35, f.mw * 0.38, Math.PI + 0.45, Math.PI * 2 - 0.45); c.stroke();
    // tear
    const ty = ((t * 0.9) % 1) * er * 3;
    const [ex, ey] = f.eyes[f.eyes.length - 1];
    c.fillStyle = "#6cc3ff"; c.beginPath();
    c.moveTo(ex + er * 0.6, ey + er * 0.6 + ty); c.quadraticCurveTo(ex + er * 1.4, ey + er * 1.6 + ty, ex + er * 0.6, ey + er * 1.9 + ty);
    c.quadraticCurveTo(ex - er * 0.2, ey + er * 1.6 + ty, ex + er * 0.6, ey + er * 0.6 + ty); c.fill();
  } else { // scared
    for (const [x, y] of f.eyes) {
      c.fillStyle = "#fff"; c.strokeStyle = ink; c.lineWidth = er * 0.35;
      c.beginPath(); c.arc(x, y, er * 1.35, 0, 7); c.fill(); c.stroke();
      c.fillStyle = ink; c.beginPath(); c.arc(x + er * 0.25, y, er * 0.45, 0, 7); c.fill();
    }
    const [mx, my] = f.mouth;
    c.fillStyle = "#5a1f1f"; c.beginPath(); c.ellipse(mx, my, f.mw * 0.28, f.mw * 0.36, 0, 0, 7); c.fill();
  }
  c.restore();
}

// ---------------------------------------------------------------- animals
// Each draw(p, a) is in local units, facing right, feet at y=0.
// a = { t, step (0..1 gait), flap }
const SPECIES = [
  { id: "bear", time: "day", name: "Bear", move: "walk", h: 125, speed: 0.045, tough: 0.75, play: ["roll", "wave"],
    face: { eyes: [[30, -96], [47, -95]], er: 3.6, mouth: [52, -77], mw: 10 },
    draw(p, a) {
      const k = Math.sin(a.step * Math.PI * 2) * 6;
      p.r(-34 + k, -24, 20, 24, 8, "#6f4529"); p.r(16 - k, -24, 20, 24, 8, "#6f4529");
      p.e(0, -48, 50, 40, 0, "#8a5a3b");
      p.e(10, -42, 28, 24, 0, "#c08a5f");
      p.c(15, -116, 11, "#8a5a3b"); p.c(50, -114, 11, "#8a5a3b");
      p.c(34, -90, 30, "#8a5a3b");
      p.d(c => { c.fillStyle = "#c08a5f"; c.beginPath(); c.arc(15, -116, 5.5, 0, 7); c.arc(50, -114, 5.5, 0, 7); c.fill(); });
      p.e(50, -80, 16, 12, 0, "#d9a77c");
      p.d(c => { c.fillStyle = "#3a2418"; c.beginPath(); c.ellipse(60, -86, 6, 4.5, 0, 0, 7); c.fill(); });
      p.r(-22 - k, -22, 22, 22, 9, "#7a4d30"); p.r(26 + k, -22, 22, 22, 9, "#7a4d30");
    } },
  { id: "bobcat", time: "day", name: "Bobcat", move: "walk", h: 90, speed: 0.07, tough: 0.45, play: ["pounce", "spin"],
    face: { eyes: [[34, -64], [48, -63]], er: 3.2, mouth: [50, -51], mw: 8 },
    draw(p, a) {
      const k = Math.sin(a.step * Math.PI * 2) * 7;
      p.e(-40, -48, 7, 11, -0.5, "#c9925a");
      p.d(c => { c.fillStyle = "#2a1a12"; c.beginPath(); c.ellipse(-43, -55, 5, 5, 0, 0, 7); c.fill(); });
      for (const [lx, ph] of [[-28, 1], [-14, -1], [12, -1], [26, 1]]) p.r(lx + k * ph * 0.5, -26, 9, 26, 4, "#b57f48");
      p.e(0, -36, 40, 20, 0, "#c9925a");
      p.d(c => { c.fillStyle = "#7a4e2a"; for (const [x, y] of [[-20, -42], [-6, -46], [8, -40], [-14, -32], [2, -30], [18, -34], [-26, -34]]) { c.beginPath(); c.ellipse(x, y, 3.5, 2.6, 0, 0, 7); c.fill(); } });
      p.p([24, -72, 22, -94, 36, -80], "#c9925a"); p.p([42, -78, 50, -98, 54, -76], "#c9925a");
      p.d(c => { c.strokeStyle = "#2a1a12"; c.lineWidth = 2.5; c.beginPath(); c.moveTo(22, -94); c.lineTo(21, -102); c.moveTo(50, -98); c.lineTo(51, -106); c.stroke(); });
      p.p([22, -56, 12, -44, 26, -48], "#f3e3c8"); p.p([58, -56, 66, -44, 54, -48], "#f3e3c8");
      p.c(40, -62, 22, "#c9925a");

// Grey squirrel: draw with a colour swap
const COLOR_SWAP = { "#b8642f": "#8f8f99", "#d98a4e": "#b3b3bc", "#f0d2a8": "#f2f0ec", "#9c5226": "#77777f" };
function speciesDraw(sp, p, a) {
  if (sp.tint !== "grey") return sp.draw(p, a);
  const wrap = Object.create(p);
  const sw = col => COLOR_SWAP[col] || col;
  wrap.e = (x, y, rx, ry, rot, c) => p.e(x, y, rx, ry, rot, sw(c));
  wrap.c = (x, y, r, c) => p.c(x, y, r, sw(c));
  wrap.p = (pts, c) => p.p(pts, sw(c));
  wrap.r = (x, y, w, h, r, c) => p.r(x, y, w, h, r, sw(c));
  wrap.d = fn => p.d(c => { const f = c.fillStyle; fn(new Proxy(c, { set(t, k, v) { t[k] = (k === "fillStyle" ? sw(v) : v); return true; }, get(t, k) { const v = t[k]; return typeof v === "function" ? v.bind(t) : v; } })); });
  sp.draw(wrap, a);
}

const MOON = () => ({ x: W * 0.82, y: H * 0.16 });

function buildBackground(pal) {
  const bg = document.createElement("canvas");
  bg.width = cv.width; bg.height = cv.height;
  const c = bg.getContext("2d");
  c.scale(DPR, DPR);
  const p = makePen(c, pal.edge);
  // sky
  const sky = c.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, pal.sky[0]); sky.addColorStop(1, pal.sky[1]);
  c.fillStyle = sky; c.fillRect(0, 0, W, HORIZON + 40);
  const m = MOON();
  c.save(); c.translate(m.x, m.y);
  if (!pal.night) {
    // sun
    c.fillStyle = "rgba(255,240,170,0.5)"; c.beginPath(); c.arc(0, 0, 70, 0, 7); c.fill();
    drawCutout(c, p, 8, () => p.c(0, 0, 44, "#ffd84a"));
  } else {
    // moon with soft glow and craters
    const mg = c.createRadialGradient(0, 0, 30, 0, 0, 120);
    mg.addColorStop(0, "rgba(220,230,255,0.35)"); mg.addColorStop(1, "rgba(220,230,255,0)");
    c.fillStyle = mg; c.beginPath(); c.arc(0, 0, 120, 0, 7); c.fill();
    drawCutout(c, p, 8, () => {
      p.c(0, 0, 42, "#fff4c8");
      p.d(c2 => { c2.fillStyle = "#ece0a8"; for (const [x, y, r] of [[-14, -10, 9], [12, 8, 7], [-4, 18, 5], [18, -14, 4]]) { c2.beginPath(); c2.arc(x, y, r, 0, 7); c2.fill(); } });
    });
  }
  c.restore();
  // clouds
  const cc = pal.night ? "#4a5785" : "#fff";
  const cloud = (x, y, s) => { c.save(); c.translate(x, y); c.scale(s, s); drawCutout(c, p, 8, () => { p.c(-40, 0, 26, cc); p.c(0, -14, 34, cc); p.c(40, 0, 26, cc); p.r(-62, -4, 124, 28, 14, cc); }); c.restore(); };
  if (pal.night) { cloud(W * 0.22, H * 0.15, 0.7); cloud(W * 0.56, H * 0.1, 0.5); }
  else { cloud(W * 0.18, H * 0.12, 0.9); cloud(W * 0.5, H * 0.07, 0.7); cloud(W * 0.62, H * 0.22, 0.55); }
  // hills
  const hill = (y, col, amp, freq, ph) => {
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) c.lineTo(x, y + Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 2.3 + ph) * amp * 0.4);
    c.lineTo(W, H); c.closePath();
    c.save(); c.translate(0, -4); c.fillStyle = pal.edge; c.fill(); c.restore();
    c.fillStyle = col; c.fill();
  };
  hill(HORIZON - 40, pal.hills[0], 22, 0.006, 1);
  hill(HORIZON - 10, pal.hills[1], 16, 0.009, 3);
  // back treeline
  const rowY = HORIZON + 6;
  for (let x = -20; x < W + 40; x += 34) {
    const h = 50 + ((x * 7919) % 30);
    c.save(); c.translate(x, rowY);
    drawCutout(c, p, 5, () => { if ((x / 34) % 3 < 1) p.p([-20, 0, 0, -h - 20, 20, 0], pal.pine); else { p.c(0, -h * 0.6, 22, pal.leaf); p.r(-4, -h * 0.4, 8, h * 0.4, 3, pal.trunk); } });
    c.restore();
  }
  // meadow ground
  const g = c.createLinearGradient(0, HORIZON, 0, H);
  g.addColorStop(0, pal.ground[0]); g.addColorStop(1, pal.ground[1]);
  c.fillStyle = g; c.fillRect(0, rowY, W, H - rowY);
  // clearing (lighter oval; moonlight at night)
  const cP = proj(0.5, 0.5);
  const cg = c.createRadialGradient(cP.x, cP.y, 10, cP.x, cP.y, W * 0.5);
  cg.addColorStop(0, `rgba(${pal.clearing},${pal.clearA})`); cg.addColorStop(1, `rgba(${pal.clearing},0)`);
  c.fillStyle = cg; c.beginPath(); c.ellipse(cP.x, cP.y, W * 0.48, (H - HORIZON) * 0.42, 0, 0, 7); c.fill();
  // little path stones, grass tufts, flowers (deterministic)
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    const x = rnd(), z = rnd(); const P = proj(x, z);
    c.save(); c.translate(P.x, P.y); c.scale(P.s, P.s);
    const kind = rnd();
    const col = pal.flowers[(rnd() * pal.flowers.length) | 0];
    if (kind < 0.55) {
      c.fillStyle = pal.grass;
      for (let j = -1; j <= 1; j++) { c.beginPath(); c.moveTo(j * 6 - 4, 0); c.quadraticCurveTo(j * 10, -14, j * 9, -22); c.lineTo(j * 6 + 4, 0); c.fill(); }
    } else if (kind < 0.9) {
      c.strokeStyle = pal.stem; c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -16); c.stroke();
      c.translate(0, -18);
      c.fillStyle = pal.edge; c.beginPath(); c.arc(0, 0, 9.5, 0, 7); c.fill();
      c.fillStyle = col; for (let k2 = 0; k2 < 5; k2++) { const an = k2 / 5 * Math.PI * 2; c.beginPath(); c.arc(Math.cos(an) * 5, Math.sin(an) * 5, 4, 0, 7); c.fill(); }
      c.fillStyle = pal.center; c.beginPath(); c.arc(0, 0, 3, 0, 7); c.fill();
    } else {
      drawCutout(c, p, 4, () => p.e(0, -4, 14, 8, 0, pal.rock));
    }
    c.restore();
  }
  return bg;
}

// twinkling stars and drifting fireflies (night only, drawn live)
function buildSky() {
  let seed = 3;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const m = MOON();
  stars = [];
  for (let i = 0; i < 80; i++) {
    const x = rnd() * W, y = rnd() * HORIZON * 0.85;
    if (Math.hypot(x - m.x, y - m.y) < 75) continue;
    stars.push({ x, y, r: 1.5 + rnd() * 2.5, sp: 1 + rnd() * 2.5, ph: rnd() * 7 });
  }
  flies = [];
  for (let i = 0; i < 18; i++) flies.push({ x: rnd() * W, y: HORIZON + 20 + rnd() * (H - HORIZON) * 0.75, ph: rnd() * 7, sp: 0.8 + rnd() * 1.5 });
}
function drawStars(c, t, k) {
  c.save(); c.fillStyle = "#fff6d8";
  for (const s of stars) {
    c.globalAlpha = k * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph));
    const r = s.r; c.beginPath();
    c.moveTo(s.x, s.y - r * 2); c.lineTo(s.x + r * 0.5, s.y - r * 0.5); c.lineTo(s.x + r * 2, s.y); c.lineTo(s.x + r * 0.5, s.y + r * 0.5);
    c.lineTo(s.x, s.y + r * 2); c.lineTo(s.x - r * 0.5, s.y + r * 0.5); c.lineTo(s.x - r * 2, s.y); c.lineTo(s.x - r * 0.5, s.y - r * 0.5); c.fill();
  }
  c.restore();
}
function drawFlies(c, t, k) {
  c.save(); c.globalCompositeOperation = "lighter";
  for (const f of flies) {
    const b = Math.max(0, Math.sin(t * f.sp + f.ph)); if (b <= 0) continue;
    const x = f.x + Math.sin(t * 0.4 + f.ph) * 40, y = f.y + Math.sin(t * 0.7 + f.ph * 2) * 18;
    const g = c.createRadialGradient(x, y, 0, x, y, 14);
    g.addColorStop(0, `rgba(240,255,150,${0.9 * b * k})`); g.addColorStop(1, "rgba(240,255,150,0)");
    c.fillStyle = g; c.beginPath(); c.arc(x, y, 14, 0, 7); c.fill();
  }
  c.restore();
}

const parts = [];
function puff(x, y, type, s) {
  parts.push({ x, y, vx: rand(-20, 20), vy: type === "dust" ? rand(-20, -5) : rand(-60, -35), life: 0, max: type === "dust" ? 0.6 : 1.4, type, s: s || 1, rot: rand(-0.4, 0.4) });
}
function drawParts(c, dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i]; q.life += dt; if (q.life > q.max) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    const a = 1 - q.life / q.max;
    c.save(); c.globalAlpha = a; c.translate(q.x, q.y); c.rotate(q.rot); c.scale(q.s, q.s);
    c.textAlign = "center"; c.textBaseline = "middle";
    if (q.type === "dust") { c.fillStyle = "#f3ead8"; c.beginPath(); c.arc(0, 0, 8 * (1 + q.life), 0, 7); c.fill(); }
    else {
      const glyph = { heart: "♥", note: "♪", alarm: "!", sweat: "💧", spark: "✦", zzz: "z" }[q.type];
      const col = { heart: "#ff5c8a", note: "#7b5cff", alarm: "#ff3b30", sweat: "#4fb3ff", spark: "#ffcc00", zzz: "#6b7a99" }[q.type];
      c.font = "900 26px system-ui, sans-serif";
      c.lineWidth = 6; c.strokeStyle = "#fff"; c.strokeText(glyph, 0, 0);
      c.fillStyle = col; c.fillText(glyph, 0, 0);
    }
    c.restore();
  }
}

// ---------------------------------------------------------------- creatures
const animals = [];
const seen = new Set();
let showAll = false;

class Animal {
  constructor(sp, opts = {}) {
    this.sp = sp;
    this.side = opts.side ?? (Math.random() < 0.5 ? -1 : 1);
    this.x = this.side < 0 ? -0.15 : 1.15;
    this.z = rand(0.15, 0.9);
    this.state = "enter";
    this.pickTarget();
    this.face = this.tx > this.x ? 1 : -1; this.flip = this.face;
    this.t = rand(0, 10); this.step = 0; this.hop = 0; this.flap = 0;
    this.fear = 0; this.mood = "ok"; this.moodT = 0;
    this.blinkT = rand(1, 4); this.blink = false;
    this.wait = 0; this.act = null; this.actT = 0;
    this.alt = sp.move === "fly" ? rand(90, 150) : sp.move === "hover" ? rand(60, 110) : 0;
    this.spin = 0; this.shake = 0; this.emoteT = rand(2, 5);
    if (opts.magic) for (let i = 0; i < 4; i++) { const P = proj(this.x, this.z); puff(P.x, P.y - 30, "spark"); }
  }
  pickTarget() { this.tx = rand(0.14, 0.86); this.tz = rand(0.08, 0.95); }
  // day/night changed and it's not this animal's time: yawn and wander home
  goHome() {
    if (this.state === "flee" || this.state === "leave") return;
    this.state = "leave"; this.act = null; this.wait = rand(0, 0.8);
    this.tx = this.x < 0.5 ? -0.3 : 1.3; this.tz = this.z;
    const P = proj(this.x, this.z); puff(P.x, P.y - this.sp.h * P.s - 10, "zzz", 1.1);
  }
  comeBack() { if (this.state === "leave") { this.state = "play"; this.pickTarget(); this.wait = 0; } }
  get flying() { return this.sp.move === "fly" || this.sp.move === "hover"; }

  update(dt, level) {
    const sp = this.sp;
    this.t += dt;
    // fear: loud fills it (tough animals fill slower); quiet drains it
    if (level > LOUD) this.fear += dt * (1.6 - sp.tough * 1.1) * (0.6 + (level - LOUD) * 3);
    else this.fear = Math.max(0, this.fear - dt * (level < QUIET ? 0.8 : 0.25));

    if (this.state !== "flee" && this.fear > 1) {
      this.state = "flee"; this.act = null;
      this.tx = this.x < 0.5 ? -0.3 : 1.3; this.tz = this.z;
      const P = proj(this.x, this.z); puff(P.x, P.y - sp.h * P.s - 10, "alarm", 1.2);
    }

    // mood
    let target;
    if (this.state === "flee" || level > LOUD) target = "scared";
    else if (this.state === "leave") target = "ok";
    else if (level > QUIET) target = "sad";
    else target = this.t > 3 && this.state !== "enter" ? "happy" : "ok";
    if (target !== this.mood) { this.moodT += dt; if (this.moodT > (target === "scared" ? 0.05 : 0.35)) { this.mood = target; this.moodT = 0; } }
    else this.moodT = 0;
    if (this.mood === "happy" && Math.random() < dt * 0.2) this.mood = "ok"; // mix in open-eyed looks
    this.blinkT -= dt; if (this.blinkT < 0) { this.blink = !this.blink; this.blinkT = this.blink ? 0.12 : rand(2, 5); }

    // movement
    let spd = sp.speed;
    const onScreen = this.x > 0.04 && this.x < 0.96;
    // talking: animals in the clearing freeze; ones still in the woods wait out of sight
    const frozen = level > QUIET && this.state !== "flee" && this.state !== "leave" && (onScreen || this.state !== "enter");
    if (level > QUIET && this.state === "enter" && !onScreen) { this.wait = 0.3; }
    if (this.state === "flee") spd *= 3.6;
    if (this.state === "leave") spd *= 1.5;
    if (frozen) { spd = 0; this.act = null; this.shake = level > LOUD ? 1 : 0.3; } else this.shake = 0;

    if (this.act && this.state === "play") {
      this.actT -= dt; if (this.actT <= 0) this.act = null; spd = 0;
    }

    const dx = this.tx - this.x, dz = this.tz - this.z;
    const dist = Math.hypot(dx, dz * 0.7);
    let moving = false;
    if (spd > 0 && dist > 0.01 && this.wait <= 0) {
      const m = Math.min(dist, spd * dt);
      this.x += dx / dist * m; this.z += dz / dist * m * 0.7;
      moving = true;
      if (Math.abs(dx) > 0.01) this.face = dx > 0 ? 1 : -1;
    } else if (dist <= 0.01) {
      if (this.state === "enter") { this.state = "play"; this.wait = rand(0.5, 1.5); }
      else if (this.state === "play") {
        if (this.wait <= 0) {
          // pick next thing to do: wander, play with a friend, or do a trick
          const r = Math.random();
          if (r < 0.35) { this.act = pick(sp.play); this.actT = rand(1.4, 2.6); }
          else if (r < 0.6 && animals.length > 1) { const f = pick(animals.filter(o => o !== this && o.state === "play")); if (f) { this.tx = clamp(f.x + rand(-0.08, 0.08), 0.1, 0.9); this.tz = clamp(f.z + rand(-0.06, 0.06), 0.05, 0.95); } else this.pickTarget(); }
          else this.pickTarget();
          this.wait = rand(0.4, 2);
        }
      }
    }
    if (this.wait > 0 && !frozen) this.wait -= dt;

    this.flip = lerp(this.flip, this.face, 1 - Math.exp(-dt * 14));

    const gait = sp.move === "walk" ? 2.2 : 1.6;
    if (moving) this.step += dt * gait * (this.state === "flee" ? 3 : 1) * (spd / sp.speed > 0 ? 1 : 0);
    // hopping
    if (sp.move === "hop") {
      if (moving || this.act === "binky") this.hop += dt * (this.state === "flee" ? 7 : 3.2);
      else this.hop = this.hop % 1 > 0.05 ? this.hop + dt * 3.2 : 0;
    } else if (sp.move === "walk") {
      this.hop = moving ? this.step * 2 : 0;
    }
    this.flap += dt * (sp.move === "fly" ? 9 : 0);

    // tricks
    this.spin = 0;
    if (this.act === "spin" || this.act === "roll") this.spin = ((this.actT * 2) % 1) * Math.PI * 2 * (this.act === "roll" ? 1 : 0);
    // emotes
    this.emoteT -= dt;
    if (this.emoteT < 0 && this.state === "play" && !frozen) {
      this.emoteT = rand(2.5, 6);
      const P = proj(this.x, this.z);
      puff(P.x + rand(-10, 10), P.y - (sp.h + this.alt) * P.s - 10, this.act === "sing" ? "note" : pick(["heart", "note", "heart"]));
    }
    if (this.state === "flee" && Math.random() < dt * 8 && !this.flying) { const P = proj(this.x, this.z); puff(P.x - this.face * 20 * P.s, P.y - 6, "dust", P.s); }
    if (this.state === "leave" && Math.random() < dt * 1.2) { const P = proj(this.x, this.z); puff(P.x, P.y - (sp.h + this.alt) * P.s - 10, "zzz", 0.9); }
    if (frozen && level > LOUD && Math.random() < dt * 2) { const P = proj(this.x, this.z); puff(P.x + 14, P.y - sp.h * P.s, "sweat", 0.8); }

    return !((this.state === "flee" || this.state === "leave") && (this.x < -0.25 || this.x > 1.25));
  }

  draw(c) {
    const sp = this.sp, P = proj(this.x, this.z);
    const s = P.s;
    let lift = 0, sq = 1;
    if (sp.move === "hop") { const ph = this.hop % 1; lift = Math.sin(ph * Math.PI) * 26; sq = ph < 0.08 || ph > 0.92 ? 0.9 : 1.04; if (this.act === "binky") lift *= 1.6; }
    else if (sp.move === "walk") lift = Math.abs(Math.sin(this.hop * Math.PI)) * 3;
    if (this.flying) lift = this.alt + Math.sin(this.t * (sp.move === "hover" ? 6 : 2)) * (sp.move === "hover" ? 4 : 10);
    if (this.act === "pounce") { const ph = (this.actT * 1.2) % 1; lift += Math.max(0, Math.sin(ph * Math.PI * 2)) * 30; }
    if (this.act === "loop") lift += Math.sin(this.t * 5) * 30;
    if (this.act === "bob" || this.act === "sing") sq = 1 + Math.sin(this.t * 12) * 0.05;
    if (this.mood === "happy" && !this.flying && sp.move !== "hop") sq *= 1 + Math.sin(this.t * 6) * 0.025;

    // ground shadow
    const shw = (sp.h * 0.55 + 10) * s, shk = this.flying ? 0.6 : 1 - lift / 120;
    c.fillStyle = "rgba(30,60,20,0.25)";
    c.beginPath(); c.ellipse(P.x, P.y, shw * shk, shw * 0.22 * shk, 0, 0, 7); c.fill();

    c.save();
    const shake = this.shake ? Math.sin(this.t * 60) * 1.6 * this.shake : 0;
    c.translate(P.x + shake, P.y - lift * s);
    c.scale(s, s);
    if (this.spin) { c.translate(0, -sp.h / 2); c.rotate(this.spin * this.face); c.translate(0, sp.h / 2); }
    // Paper-Mario turn: squash horizontally through zero
    c.scale(this.flip * (1 / sq), sq);
    const anim = { t: this.t, step: this.step, flap: this.flap, acorn: this.act === "acorn", nibble: this.act === "nibble", sing: this.act === "sing" };
    drawCutout(c, pen, 9, () => speciesDraw(sp, pen, anim));
    // hide face while edge-on during a flip
    if (Math.abs(this.flip) > 0.25) drawFace(c, sp.face, this.mood, this.t, this.blink);
    c.restore();

    if (this.act === "flower") {
      c.save(); c.translate(P.x + this.face * 40 * s, P.y - (this.alt - 10) * s); c.scale(s, s);
      c.fillStyle = "#ff5c8a"; c.beginPath(); c.arc(0, 0, 9, 0, 7); c.fill(); c.fillStyle = "#ffd84a"; c.beginPath(); c.arc(0, 0, 3.5, 0, 7); c.fill(); c.restore();
    }
    if (this.act === "wave" && !this.shake) {
      c.save(); c.font = `${Math.round(26 * s)}px system-ui`; c.textAlign = "center";
      c.fillText("👋", P.x + this.face * 30 * s, P.y - (sp.h + 10) * s + Math.sin(this.t * 10) * 4); c.restore();
    }
  }
}

// day / night
let night = false, nightT = 0;   // nightT eases 0 (day) .. 1 (night)
const fits = sp => sp.time === "both" || sp.time === (night ? "night" : "day");
const eligible = () => SPECIES.filter(fits);

function present() { return new Set(animals.map(a => a.sp.id)); }
function spawnOne(magic) {
  const here = present();
  const left = eligible().filter(s => !here.has(s.id));
  if (!left.length) return false;
  // favour ones we haven't met yet so everyone gets a turn
  const fresh = left.filter(s => !seen.has(s.id));
  const sp = pick(fresh.length && Math.random() < 0.7 ? fresh : left);
  animals.push(new Animal(sp, { magic }));
  if (!seen.has(sp.id)) { seen.add(sp.id); updateRoster(); }
  return true;
}

// ---------------------------------------------------------------- audio
let analyser = null, buf = null, mode = "none"; // "mic" | "button"
let level = 0, peak = 0, noiseHeld = false;
// No-mic button: the longer you hold, the louder it gets (whisper → talking → loud).
// Let go and it settles back down, so short taps stay quiet-ish and long holds get LOUD.
const HOLD_RISE = 0.27;   // noise added per second while held (~0.8s to leave quiet, ~2.1s to get loud)
const HOLD_FALL = 0.9;    // noise lost per second after letting go
let btnNoise = 0, btnLast = performance.now();
const sensEl = document.getElementById("sens");
try { const s = localStorage.getItem("hush-sens"); if (s) sensEl.value = s; } catch (e) {}
sensEl.addEventListener("input", () => { try { localStorage.setItem("hush-sens", sensEl.value); } catch (e) {} });

async function startMic() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  if (ac.state === "suspended") await ac.resume();
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser(); analyser.fftSize = 1024;
  buf = new Float32Array(analyser.fftSize);
  src.connect(analyser);
  mode = "mic";
}
function readLevel() {
  if (SIM) { const seq = params.get("sim").split(",").map(Number); return seq[Math.min(seq.length - 1, Math.floor(performance.now() / 5000))] || 0; }
  if (mode === "button") {
    const now = performance.now(), dt = Math.min(0.1, (now - btnLast) / 1000); btnLast = now;
    btnNoise = clamp(btnNoise + (noiseHeld ? HOLD_RISE : -HOLD_FALL) * dt, 0, 1);
    const v = 0.06 + btnNoise * 0.94;
    return clamp(v + (Math.random() - 0.5) * (0.03 + 0.05 * btnNoise), 0, 1);
  }
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / buf.length) * Math.pow(10, (parseFloat(sensEl.value) - 0.5) * 2);
  const db = 20 * Math.log10(rms + 1e-9);
  return clamp((db + 52) / 38, 0, 1);   // ~-52 dBFS = silent, ~-14 dBFS = max
}

document.getElementById("tickA").style.left = QUIET * 100 + "%";

let showAllRun = 0;
function runShowAll() {
  const run = ++showAllRun; let i = 0;
  const tick = () => { if (!showAll || run !== showAllRun) return; if (spawnOne(true) && ++i < 40) setTimeout(tick, 180); };
  tick();
}

  showAll = !showAll;
  allBtn.classList.toggle("on", showAll);
  allBtn.textContent = showAll ? "🍃 Let Them Roam" : "✨ Show All Animals";
  if (showAll) runShowAll();
};

const nightBtn = document.getElementById("nightBtn");
function setNight(v, instant) {
  night = v;
  if (instant) nightT = v ? 1 : 0;
  nightBtn.textContent = v ? "☀️ Make it Day" : "🌙 Make it Night";
  nightBtn.classList.toggle("day", v);
  for (const a of animals) fits(a.sp) ? a.comeBack() : a.goHome();
  spawnT = Math.max(spawnT, 1.2);   // give the old crowd a moment to head home
  updateRoster();

}

// roster thumbnails
const roster = document.getElementById("roster");
const thumbs = {};
function makeThumb(sp) {
  const c = document.createElement("canvas"); c.width = 88; c.height = 88; c.title = sp.name;
  thumbs[sp.id] = c; roster.appendChild(c);
}
function paintThumb(sp) {
  const c = thumbs[sp.id], g = c.getContext("2d"), p = makePen(g);
  g.clearRect(0, 0, 88, 88);
  const box = sp.thumbBox || Math.max(sp.h, 60) + 30;
  const sc = 76 / box;
  g.save(); g.translate(sp.thumbX || 38, 80); g.scale(sc, sc);
  const known = seen.has(sp.id);
  g.lineJoin = "round"; g.lineWidth = 8;
  const a = { t: 1, step: 0, flap: 1 };
  if (known) { p.mode = "edge"; speciesDraw(sp, p, a); p.mode = "fill"; speciesDraw(sp, p, a); drawFace(g, sp.face, "happy", 0, false); }
  else { p.mode = "sil"; speciesDraw(sp, p, a); }
  g.restore();
  c.classList.toggle("seen", known);
  c.style.display = fits(sp) ? "" : "none";   // roster shows only this time's animals
  if (!known) { g.fillStyle = "#8a7a60"; g.font = "900 30px system-ui"; g.textAlign = "center"; g.fillText("?", 66, 34); }
}
function updateRoster() { for (const sp of SPECIES) paintThumb(sp); }
SPECIES.forEach(makeThumb); updateRoster();

// no-mic button
const noiseBtn = document.getElementById("noiseBtn");
const setNoise = v => e => { e.preventDefault(); noiseHeld = v; if (v && e.pointerId != null) try { noiseBtn.setPointerCapture(e.pointerId); } catch (_) {} };
const nbIcon = noiseBtn.querySelector(".nb-icon"), nbText = noiseBtn.querySelector(".nb-text");

// ---------------------------------------------------------------- loud shake
const REDUCED_MOTION = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let shake = 0, wiggleOn = false, wiggleVal = -1;
// UI wiggle: CSS does the motion; --wig (0..1) sets how big it is
function setWiggle(a) {
  const on = a > 0.04;
  if (on !== wiggleOn) { wiggleOn = on; document.body.classList.toggle("loud", on); }
  const v = Math.round(a * 20) / 20;
  if (v !== wiggleVal) { wiggleVal = v; document.body.style.setProperty("--wig", v); }
}

// ---------------------------------------------------------------- main loop
let last = performance.now(), quietFor = 0, spawnT = 0, loudFor = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const started = mode !== "none" || SIM;

  // level smoothing: rise fast, fall slowly
  const raw = started ? readLevel() : 0.05;
  if (mode === "button") updateNoiseBtn();
  level += (raw - level) * (1 - Math.exp(-dt * (raw > level ? 18 : 2.5)));
  peak = Math.max(level, peak - dt * 0.35);

  if (started) {
    if (level < QUIET) quietFor += dt; else quietFor = 0;
    loudFor = level > LOUD ? loudFor + dt : 0;
    spawnT -= dt;
    if (quietFor > QUIET_BEFORE_SPAWN && spawnT <= 0) { spawnOne(false); spawnT = SPAWN_EVERY * rand(0.8, 1.3); }
    if (showAll && level < QUIET && spawnT <= 0) { spawnOne(true); spawnT = 0.5; }
  }

  // update creatures
  for (let i = animals.length - 1; i >= 0; i--) if (!animals[i].update(dt, level)) animals.splice(i, 1);

  // draw
  // page can load before it has a size (e.g. a background tab): wait for one
  if (!bgDay || !bgDay.width || !bgDay.height) { if (window.innerWidth && window.innerHeight) resize(); requestAnimationFrame(frame); return; }

  nightT = clamp(nightT + (night ? 1 : -1) * dt * 0.6, 0, 1);
  const nk = nightT * nightT * (3 - 2 * nightT);   // smoothstep fade
  const t = now / 1000;

  // loud = earthquake: shake builds fast, settles gently when it gets quieter
  // shake grows with the meter: none in the green, a little rattle in the yellow, big shaking in the red
  const shakeTarget = level < QUIET ? 0
    : level < LOUD ? 0.05 + 0.25 * (level - QUIET) / (LOUD - QUIET)
    : 0.4 + 0.6 * clamp((level - LOUD) / (1 - LOUD), 0, 1);
  shake += (shakeTarget - shake) * (1 - Math.exp(-dt * (shakeTarget > shake ? 14 : 4)));
  if (shake < 0.002) shake = 0;
  const amt = shake * (REDUCED_MOTION ? 0.25 : 1);
  // camera: layered sines read as a wobbly paper quake rather than random jitter
  const camX = (Math.sin(t * 43) + 0.6 * Math.sin(t * 27.3 + 1.7) + 0.3 * Math.sin(t * 71 + 0.4)) * 10 * amt;
  const camY = (Math.sin(t * 37 + 2.1) + 0.6 * Math.sin(t * 23.9) + 0.3 * Math.sin(t * 64 + 1.1)) * 7 * amt;
  const camR = (Math.sin(t * 19 + 0.3) + 0.5 * Math.sin(t * 31)) * 0.012 * amt;
  const camZ = 1 + 0.1 * amt;    // zoom in a touch so the edges never show
  const camera = () => {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (amt) { ctx.translate(W / 2 + camX, H / 2 + camY); ctx.rotate(camR); ctx.scale(camZ, camZ); ctx.translate(-W / 2, -H / 2); }
  };
  setWiggle(amt);

  camera();
  ctx.globalAlpha = 1;
  if (nk < 1) ctx.drawImage(bgDay, 0, 0, W, H);
  if (nk > 0) { ctx.globalAlpha = nk; ctx.drawImage(bgNight, 0, 0, W, H); ctx.globalAlpha = 1; drawStars(ctx, t, nk); }

  // trees + animals on their own layer, tinted blue at night
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, layer.width, layer.height);
  lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const list = [...trees.map(t => ({ z: t.z, tree: t })), ...animals.map(a => ({ z: a.z + (a.flying ? 0.001 : 0), a }))];
  list.sort((p, q) => p.z - q.z);
  for (const it of list) it.tree ? drawTree(lctx, it.tree, t) : it.a.draw(lctx);
  if (nk > 0) {
    lctx.save(); lctx.globalCompositeOperation = "source-atop";
    lctx.fillStyle = `rgba(22,30,80,${0.4 * nk})`; lctx.fillRect(0, 0, W, H); lctx.restore();
  }
  camera(); ctx.drawImage(layer, 0, 0, W, H);
  if (nk > 0) drawFlies(ctx, t, nk);
  drawParts(ctx, dt);

  // loud tint
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (level > LOUD) { ctx.fillStyle = `rgba(255,80,60,${(level - LOUD) * 0.35})`; ctx.fillRect(0, 0, W, H); }

  // UI
  const col = level < QUIET ? "var(--green)" : level < LOUD ? "var(--yellow)" : "var(--red)";
  fillEl.style.width = (level * 100).toFixed(1) + "%"; fillEl.style.background = col;
  peakEl.style.left = `calc(${(peak * 100).toFixed(1)}% - 2px)`;
  const n = animals.filter(a => a.state !== "flee" && a.state !== "leave" && a.x > 0 && a.x < 1).length;
  const total = eligible().length;
  let msg;
  if (!started) msg = "";
  else if (level > LOUD) msg = n ? "Too loud! They're scared! 😱" : "Too loud! 😱";
  else if (level > QUIET) msg = "Shhh… they're getting sad 😢";
  else if (n === 0) msg = "Shhh… be very quiet… 🤫";
  else if (n >= total) msg = night ? "All the night friends are here! 🌙" : "Everyone is here! 🎉";
  else msg = night ? "Shhh… night friends are waking up! 🌙" : "Shhh… more friends are coming! 🌿";
  if (statusEl.textContent !== msg) statusEl.textContent = msg;
  const cnt = `🐾 ${n} / ${total}`;
  if (countEl.textContent !== cnt) countEl.textContent = cnt;

  requestAnimationFrame(frame);
}

resize();
if (params.has("night")) setNight(true, true);   // ?night starts at night (for testing)
if (SIM) { showGame(); if (params.has("all")) allBtn.click(); }
// ?flip=8 toggles day/night every 8s (for testing)
if (params.has("flip")) setInterval(() => setNight(!night), (parseFloat(params.get("flip")) || 8) * 1000);
requestAnimationFrame(frame);
})();
</script>
</body>
